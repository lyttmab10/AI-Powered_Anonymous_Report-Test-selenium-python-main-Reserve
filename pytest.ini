[pytest]
testpaths = tests
pythonpath = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    # Functional Groups
    fr_sub:  FR-SUB – Anonymous Report Submission
    fr_ai:   FR-AI  – AI Analysis (Gemini)
    fr_trk:  FR-TRK – Tracking & 2-way Chat
    fr_cas:  FR-CAS – Case Management
    fr_ana:  FR-ANA – Analytics Dashboard
    fr_sec:  FR-SEC – Authentication & Security
    fr_sys:  FR-SYS – System Infrastructure & Real-time

